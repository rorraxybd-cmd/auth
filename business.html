<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROORaxy Enterprise - Project Requests Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- কঠোর সিকিউরিটি গার্ড: ভেরিফাই এবং মাস্টার পাসওয়ার্ড দেওয়া না থাকলে সরাসরি index.html এ পাঠিয়ে দেবে -->
    <script>
        (function() {
            const v1 = localStorage.getItem('rorraxy_admin_verified');
            const v2 = localStorage.getItem('rorraxy_admin_authenticated_session');
            const v3 = localStorage.getItem('rorraxy_master_key_passed');
            if (v1 !== 'true' || v2 !== 'active' || v3 !== 'true') {
                window.location.replace('/index.html');
            }
        })();
    </script>

    <style>
        :root {
            --bg-pure: #000000;
            --card-soft: #0a0a0f;
            --card-border: #1a1a24;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --gold-solid: #d4af37;
            --accent-green: #00ff80;
            --accent-red: #ff4d4d;
            --text-white: #ffffff;
            --text-gray: #8a8a9e;
            --font-main: 'Poppins', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }
        body { background-color: var(--bg-pure); color: var(--text-white); min-height: 100vh; display: flex; }

        /* Sidebar */
        aside { width: 260px; background: var(--card-soft); border-right: 1px solid var(--card-border); position: fixed; height: 100vh; display: flex; flex-direction: column; }
        .brand-box { padding: 24px; font-size: 20px; font-weight: 700; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; border-bottom: 1px solid var(--card-border); }
        .nav-links { list-style: none; padding: 20px 0; }
        .nav-links li a { display: flex; align-items: center; gap: 12px; padding: 14px 24px; color: var(--text-gray); text-decoration: none; font-size: 14px; transition: 0.3s; }
        .nav-links li.active a, .nav-links li a:hover { color: var(--text-white); background: rgba(212, 175, 55, 0.08); border-left: 4px solid var(--gold-solid); }

        /* Main Content */
        main { margin-left: 260px; flex-grow: 1; padding: 30px; overflow-y: auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--card-border); }
        header h1 { font-size: 24px; font-weight: 600; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-soft); border: 1px solid var(--card-border); border-radius: 12px; padding: 20px; }
        .stat-card h3 { font-size: 13px; color: var(--text-gray); margin-bottom: 8px; font-weight: 400; }
        .stat-card .value { font-size: 22px; font-weight: 700; color: var(--gold-solid); }

        /* Controls & Search */
        .controls-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-soft); padding: 16px 20px; border-radius: 12px; border: 1px solid var(--card-border); margin-bottom: 20px; gap: 15px; flex-wrap: wrap; }
        .search-box { position: relative; flex-grow: 1; max-width: 400px; }
        .search-box input { width: 100%; background: var(--bg-pure); border: 1px solid var(--card-border); padding: 10px 15px 10px 40px; border-radius: 8px; color: var(--text-white); outline: none; font-size: 14px; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-gray); }

        .filter-group select { background: var(--bg-pure); border: 1px solid var(--card-border); color: var(--text-white); padding: 10px 14px; border-radius: 8px; outline: none; cursor: pointer; font-size: 14px; }

        /* Table */
        .table-container { background: var(--card-soft); border: 1px solid var(--card-border); border-radius: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 16px 20px; border-bottom: 1px solid var(--card-border); }
        th { background: rgba(255, 255, 255, 0.02); color: var(--text-gray); font-weight: 500; }
        tr:hover { background: rgba(255, 255, 255, 0.01); }

        .req-link { color: var(--gold-solid); text-decoration: none; font-weight: 600; cursor: pointer; }
        .req-link:hover { text-decoration: underline; }

        /* Badges */
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; display: inline-block; }
        .badge.pending { background: rgba(255, 193, 7, 0.15); color: #ffc107; border: 1px solid rgba(255, 193, 7, 0.3); }
        .badge.approved { background: rgba(0, 255, 128, 0.15); color: var(--accent-green); border: 1px solid rgba(0, 255, 128, 0.3); }
        .badge.denied { background: rgba(255, 77, 77, 0.15); color: var(--accent-red); border: 1px solid rgba(255, 77, 77, 0.3); }

        /* Action Buttons */
        .btn-action { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 12px; margin-right: 5px; }
        .btn-approve { background: var(--accent-green); color: #000; }
        .btn-deny { background: var(--accent-red); color: #fff; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(6px); }
        .modal-content { background: var(--card-soft); border: 1px solid var(--card-border); width: 95%; max-width: 650px; border-radius: 16px; padding: 30px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--card-border); }
        .close-modal { background: none; border: none; color: var(--text-gray); font-size: 20px; cursor: pointer; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .info-group label { display: block; font-size: 12px; color: var(--text-gray); margin-bottom: 4px; }
        .info-group p { font-size: 14px; font-weight: 500; color: var(--text-white); word-break: break-all; }
        .info-group.full { grid-column: span 2; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 25px; padding-top: 15px; border-top: 1px solid var(--card-border); }
        .btn-lg { padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside>
        <div class="brand-box">ROOROXY ADMIN</div>
        <ul class="nav-links">
            <li><a href="/admin/dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="/admin/seller.html"><i class="fa-solid fa-store"></i> Sellers & Finance</a></li>
            <li class="active"><a href="/admin/business-admin.html"><i class="fa-solid fa-envelope-open-text"></i> Project Requests</a></li>
        </ul>
    </aside>

    <!-- Main Section -->
    <main>
        <header>
            <h1>Business Project Requests Manager</h1>
            <div style="font-size: 13px; color: var(--text-gray);"><i class="fa-solid fa-shield-halved" style="color: var(--gold-solid);"></i> Secured Admin Mode</div>
        </header>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Requests</h3>
                <div class="value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <h3>Pending Inquiries</h3>
                <div class="value" id="stat-pending" style="color: #ffc107;">0</div>
            </div>
            <div class="stat-card">
                <h3>Approved Projects</h3>
                <div class="value" id="stat-approved" style="color: var(--accent-green);">0</div>
            </div>
        </div>

        <!-- Controls / Search -->
        <div class="controls-bar">
            <div class="search-box">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search by Client Name, Email, Country..." onkeyup="filterRequests()">
            </div>
            <div class="filter-group">
                <select id="statusFilter" onchange="filterRequests()">
                    <option value="all">All Statuses</option>
                    <option value="pending" selected>Pending</option>
                    <option value="approved">Approved</option>
                    <option value="denied">Denied</option>
                </select>
            </div>
        </div>

        <!-- Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Client & Email</th>
                        <th>WhatsApp</th>
                        <th>Budget ($)</th>
                        <th>Country</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="requestsTableBody">
                    <tr><td colspan="7" style="text-align: center; color: var(--text-gray); padding: 40px;">Loading project requests...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Details Modal -->
    <div class="modal-overlay" id="requestModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Project Details</h2>
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="info-grid" id="modalInfoBody"></div>
            <div class="modal-actions">
                <button class="btn-lg btn-deny" onclick="updateStatusFromModal('denied')"><i class="fa-solid fa-ban"></i> Deny</button>
                <button class="btn-lg btn-approve" onclick="updateStatusFromModal('approved')"><i class="fa-solid fa-check"></i> Approve Project</button>
            </div>
        </div>
    </div>

    <script>
        let allRequests = [];
        let filteredRequests = [];
        let selectedRequestId = null;

        async function fetchRequests() {
            try {
                const res = await fetch('/api/business-requests'); 
                const result = await res.json();
                if (result.success && Array.isArray(result.data)) {
                    allRequests = result.data;
                } else {
                    allRequests = [];
                }
                updateStats();
                filterRequests();
            } catch (err) {
                console.error("Failed to load requests:", err);
                document.getElementById('requestsTableBody').innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--accent-red); padding: 30px;">Error loading data from database.</td></tr>`;
            }
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = allRequests.length;
            document.getElementById('stat-pending').innerText = allRequests.filter(r => (r.status || 'pending') === 'pending').length;
            document.getElementById('stat-approved').innerText = allRequests.filter(r => r.status === 'approved').length;
        }

        function filterRequests() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const statusVal = document.getElementById('statusFilter').value;

            filteredRequests = allRequests.filter(req => {
                const matchStatus = (statusVal === 'all') || ((req.status || 'pending') === statusVal);
                const matchSearch = 
                    (req.fullName || '').toLowerCase().includes(query) ||
                    (req.email || '').toLowerCase().includes(query) ||
                    (req.country || '').toLowerCase().includes(query);
                return matchStatus && matchSearch;
            });

            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('requestsTableBody');
            if (filteredRequests.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-gray); padding: 40px;">No project requests found.</td></tr>`;
                return;
            }

            let html = '';
            filteredRequests.forEach(r => {
                const status = r.status || 'pending';
                html += `
                    <tr>
                        <td><code>#${r.id || 'N/A'}</code></td>
                        <td>
                            <a class="req-link" onclick="openModal(${r.id})">${r.fullName || 'Unnamed'}</a><br>
                            <span style="font-size: 11px; color: var(--text-gray);">${r.email}</span>
                        </td>
                        <td>${r.whatsapp || 'N/A'}</td>
                        <td>$${parseFloat(r.budget || 0).toLocaleString()}</td>
                        <td>${r.country || 'Global'}</td>
                        <td><span class="badge ${status}">${status}</span></td>
                        <td>
                            <button class="btn-action btn-approve" onclick="changeStatus(${r.id}, 'approved')"><i class="fa-solid fa-check"></i></button>
                            <button class="btn-action btn-deny" onclick="changeStatus(${r.id}, 'denied')"><i class="fa-solid fa-ban"></i></button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function openModal(id) {
            const req = allRequests.find(r => r.id === id);
            if (!req) return;
            selectedRequestId = req.id;
            document.getElementById('modalTitle').innerText = `Project Inquiry: ${req.fullName}`;

            document.getElementById('modalInfoBody').innerHTML = `
                <div class="info-group"><label>Client Full Name</label><p>${req.fullName}</p></div>
                <div class="info-group"><label>Email Address</label><p>${req.email}</p></div>
                <div class="info-group"><label>WhatsApp Number</label><p>${req.whatsapp}</p></div>
                <div class="info-group"><label>Proposed Budget</label><p style="color:var(--gold-solid);">$${parseFloat(req.budget || 0).toLocaleString()}</p></div>
                <div class="info-group"><label>Country & Code</label><p>${req.country} (${req.countryCode || 'N/A'})</p></div>
                <div class="info-group"><label>Client IP Address</label><p>${req.ipAddress || 'Unknown'}</p></div>
                <div class="info-group full"><label>Project Details / Requirements</label><p style="background:var(--bg-pure); padding:10px; border-radius:8px; border:1px solid var(--card-border);">${req.projectDetails || 'No details provided.'}</p></div>
                <div class="info-group"><label>Current Status</label><p><span class="badge ${req.status || 'pending'}">${req.status || 'pending'}</span></p></div>
            `;
            document.getElementById('requestModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('requestModal').style.display = 'none'; }

        async function changeStatus(id, newStatus) {
            if (!confirm(`Are you sure you want to set status to "${newStatus.toUpperCase()}"?`)) return;

            try {
                const res = await fetch('/api/business-requests/update-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, status: newStatus })
                });
                const data = await res.json();
                if (data.success) {
                    const req = allRequests.find(r => r.id === id);
                    if (req) req.status = newStatus;
                    updateStats();
                    filterRequests();
                    closeModal();
                } else {
                    alert("Failed to update status.");
                }
            } catch (e) {
                alert("Server connection error.");
            }
        }

        function updateStatusFromModal(newStatus) {
            if (selectedRequestId !== null) {
                changeStatus(selectedRequestId, newStatus);
            }
        }

        window.onload = () => { fetchRequests(); };
    </script>
</body>
</html>
