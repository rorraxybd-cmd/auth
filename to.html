<!-- RORRAXY CJ HUB - Complete Final Master Edition -->
<div class="cj-app-wrapper">

  <!-- 1. DIRECT VIDEO & MEDIA VIEW -->
  <div id="tabVideoLinks" class="cj-tab-view active-tab">
    <div class="cj-view-scroll-content">
      <div id="cjVideoListContainer">
        <div class="cj-empty-state">
          <span>🎬</span>
          <p>Paste any direct CJ video URL or product link below to play preview.</p>
        </div>
      </div>
    </div>

    <!-- Clean Fixed Input Bar -->
    <div class="cj-bottom-input-bar">
      <div class="cj-input-group">
        <input type="text" id="cjInputPid" placeholder="Paste Video Link or Product URL..." onfocus="this.select()">
        <button type="button" onclick="handleDirectVideoLink()" class="cj-action-btn">FETCH</button>
      </div>
    </div>
  </div>

  <!-- 2. IMPORT PAGE VIEW (/admin/import.html) -->
  <div id="tabImportPage" class="cj-tab-view">
    <iframe src="/admin/import.html" class="cj-full-iframe"></iframe>
  </div>

  <!-- 3. BOTTOM 3-ICON NAVIGATION BAR (Enhanced & Redesigned) -->
  <nav class="cj-bottom-nav">
    <div class="cj-nav-item" onclick="openCjSite()" title="CJ Site">
      <div class="cj-icon-bg">
        <i class="fa-solid fa-globe"></i>
      </div>
      <span class="cj-nav-label">CJ SITE</span>
    </div>
    
    <div class="cj-nav-item active" id="nav-video" onclick="switchTab('video')" title="Links & Video">
      <div class="cj-icon-bg">
        <i class="fa-solid fa-video"></i>
      </div>
      <span class="cj-nav-label">MEDIA HUB</span>
    </div>
    
    <div class="cj-nav-item" id="nav-import" onclick="switchTab('import')" title="Import Page">
      <div class="cj-icon-bg">
        <i class="fa-solid fa-cloud-arrow-down"></i>
      </div>
      <span class="cj-nav-label">IMPORTER</span>
    </div>
  </nav>

</div>

<!-- FontAwesome CDN for Professional Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --bg-dark: #000000;
    --card-bg: #060609;
    --gold-grad: linear-gradient(135deg, #bf953f 0%, #fcf6ba 50%, #aa771c 100%);
    --gold-solid: #d4af37;
    --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg-dark); color: #ffffff;
    font-family: var(--font-family); overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .cj-app-wrapper {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  .cj-tab-view {
    position: absolute; top: 0; left: 0; right: 0; bottom: 75px;
    display: none; width: 100%; height: calc(100% - 75px);
    background: var(--bg-dark); z-index: 10;
  }
  .cj-tab-view.active-tab { display: flex; flex-direction: column; }

  .cj-full-iframe {
    width: 100%; height: 100%; border: none; background: #ffffff;
  }

  .cj-view-scroll-content {
    flex: 1; padding: 16px; overflow-y: auto;
    max-width: 650px; margin: 0 auto; width: 100%;
    padding-bottom: 90px;
  }

  .cj-bottom-input-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(212, 175, 55, 0.15);
    padding: 12px 16px; z-index: 80;
    display: flex; justify-content: center;
  }
  .cj-bottom-input-bar .cj-input-group {
    width: 100%; max-width: 650px;
  }

  .cj-input-group { display: flex; gap: 8px; }

  .cj-input-group input {
    flex: 1; padding: 12px 14px; background: var(--card-bg);
    border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 10px;
    color: #ffffff; font-size: 0.85rem; outline: none;
  }
  .cj-input-group input:focus { border-color: var(--gold-solid); }

  .cj-action-btn {
    background: var(--gold-grad); border: none; border-radius: 10px;
    color: #000000; font-weight: 800; font-size: 0.75rem; padding: 0 20px;
    cursor: pointer; flex-shrink: 0;
  }

  .cj-single-video-card {
    background: var(--card-bg); border: 1px solid rgba(212, 175, 55, 0.15);
    border-radius: 12px; padding: 14px; margin-bottom: 14px;
  }

  .cj-label {
    display: block; font-size: 0.65rem; font-weight: 700;
    background: var(--gold-grad); -webkit-background-clip: text;
    -webkit-text-fill-color: transparent; margin-bottom: 6px; letter-spacing: 0.5px;
  }

  .cj-video-player {
    width: 100%; max-height: 240px; border-radius: 8px;
    background: #000000; margin-bottom: 8px; object-fit: contain;
  }

  .cj-empty-state {
    text-align: center; padding: 60px 10px; color: #707085; font-size: 0.8rem;
  }
  .cj-empty-state span { font-size: 2.2rem; display: block; margin-bottom: 8px; }

  /* Redesigned Bottom Navigation Bar */
  .cj-bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: 75px;
    background: rgba(3, 3, 5, 0.98); backdrop-filter: blur(12px);
    border-top: 1px solid rgba(212, 175, 55, 0.2);
    display: flex; justify-content: space-around; align-items: center;
    z-index: 100; max-width: 650px; margin: 0 auto;
    padding: 0 10px; box-sizing: border-box;
  }

  .cj-nav-item {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0.55; transition: all 0.25s ease;
    flex: 1; height: 100%; gap: 4px;
  }
  .cj-nav-item:active { transform: scale(0.92); }

  .cj-icon-bg {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(212, 175, 55, 0.1);
    transition: all 0.25s ease;
  }

  .cj-nav-item .cj-icon-bg i {
    font-size: 1.1rem;
    background: var(--gold-grad); -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .cj-nav-label {
    font-size: 0.58rem; font-weight: 700; letter-spacing: 0.8px;
    background: var(--gold-grad); -webkit-background-clip: text;
    -webkit-text-fill-color: transparent; opacity: 0.7;
    transition: opacity 0.25s ease;
  }

  .cj-nav-item.active { opacity: 1; }
  .cj-nav-item.active .cj-icon-bg {
    background: rgba(212, 175, 55, 0.12);
    border-color: rgba(212, 175, 55, 0.4);
    box-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
  }
  .cj-nav-item.active .cj-nav-label { opacity: 1; }
</style>

<script>
  function openCjSite() {
    window.open('https://cjdropshipping.com', '_blank');
  }

  function switchTab(tabName) {
    document.querySelectorAll('.cj-tab-view').forEach(el => el.classList.remove('active-tab'));
    document.querySelectorAll('.cj-nav-item').forEach(el => el.classList.remove('active'));

    if (tabName === 'video') {
      document.getElementById('tabVideoLinks').classList.add('active-tab');
      document.getElementById('nav-video').classList.add('active');
    } else if (tabName === 'import') {
      document.getElementById('tabImportPage').classList.add('active-tab');
      document.getElementById('nav-import').classList.add('active');
    }
  }

  function parseCJUrlOrId(rawInput) {
    let cleanVal = rawInput.trim();
    if (!cleanVal) return null;

    if (/^[0-9a-zA-Z]{15,}$/.test(cleanVal)) {
      return cleanVal;
    }

    let match = cleanVal.match(/[?&]pid=([0-9a-zA-Z]{10,})/) ||
                cleanVal.match(/\/(?:productDetails|detail|product)\/([0-9a-zA-Z]{10,})/) ||
                cleanVal.match(/-([0-9a-zA-Z]{15,})\.html/) ||
                cleanVal.match(/([0-9a-zA-Z]{15,})/);

    if (match && match[1]) {
      return match[1];
    }
    return cleanVal;
  }

  async function handleDirectVideoLink() {
    let inputField = document.getElementById('cjInputPid');
    let rawInput = inputField.value.trim();
    let container = document.getElementById('cjVideoListContainer');

    if (!rawInput) return;

    let isDirectVideoUrl = /\.(mp4|webm|m3u8|ogg)($|\?)/i.test(rawInput);

    if (isDirectVideoUrl) {
      let htmlContent = `
        <div class="cj-single-video-card">
          <span class="cj-label">DIRECT VIDEO PREVIEW</span>
          <video src="${rawInput}" controls autoplay class="cj-video-player"></video>
          <span class="cj-label">DIRECT MP4 VIDEO URL</span>
          <div class="cj-input-group">
            <input type="text" id="directVidField" readonly value="${rawInput}">
            <button type="button" onclick="copyValue('directVidField', this)" class="cj-action-btn">COPY</button>
          </div>
        </div>
      `;
      container.innerHTML = htmlContent;
      inputField.value = '';
      return;
    }

    let cjProductId = parseCJUrlOrId(rawInput);
    container.innerHTML = '<div class="cj-empty-state"><span>⏳</span>Fetching product media...</div>';

    try {
      const res = await fetch('/api/import-cj', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cjProductId, rawUrl: rawInput, previewOnly: true })
      });

      const result = await res.json();

      if (result.success && result.data) {
        let htmlContent = '';

        htmlContent += `
          <div class="cj-single-video-card">
            <span class="cj-label">PRODUCT ID</span>
            <div class="cj-input-group">
              <input type="text" id="finalProdId" readonly value="${cjProductId}">
              <button type="button" onclick="copyValue('finalProdId', this)" class="cj-action-btn">COPY</button>
            </div>
          </div>
        `;

        let videos = [];
        if (result.data.videoUrl) videos.push(result.data.videoUrl);
        if (result.data.videosArray && Array.isArray(result.data.videosArray)) {
          videos = videos.concat(result.data.videosArray);
        }
        videos = [...new Set(videos)];

        if (videos.length > 0) {
          videos.forEach((vidUrl, index) => {
            htmlContent += `
              <div class="cj-single-video-card">
                <span class="cj-label">VIDEO PREVIEW ${videos.length > 1 ? '#' + (index + 1) : ''}</span>
                <video src="${vidUrl}" controls class="cj-video-player"></video>
                <span class="cj-label">DIRECT MP4 VIDEO URL</span>
                <div class="cj-input-group">
                  <input type="text" id="vidUrlField_${index}" readonly value="${vidUrl}">
                  <button type="button" onclick="copyValue('vidUrlField_${index}', this)" class="cj-action-btn">COPY</button>
                </div>
              </div>
            `;
          });
        } else {
          htmlContent += `
            <div class="cj-single-video-card" style="text-align:center; padding: 25px 15px;">
              <span style="font-size: 1.8rem; display:block; margin-bottom:6px;">🎬</span>
              <p style="color: #ff2a85; font-size: 0.78rem; margin:0 0 6px 0; font-weight: 700;">API-তে সরাসরি ভিডিও পাওয়া যায়নি।</p>
              <p style="color: #a0a0b5; font-size: 0.72rem; margin:0;">CJ সাইট থেকে ভিডিওর কাস্টম URL এনে নিচের বক্সে পেস্ট করুন, সরাসরি প্লে হবে!</p>
            </div>
          `;
        }

        container.innerHTML = htmlContent;
        inputField.value = '';

      } else {
        container.innerHTML = `
          <div class="cj-empty-state">
            <p style="color: #ff2a85;">✕ Unable to load product. Paste direct MP4 URL instead.</p>
          </div>
        `;
      }
    } catch (err) {
      container.innerHTML = `<div class="cj-empty-state" style="color: #ff2a85;">✕ Error: ${err.message}</div>`;
    }
  }

  function copyValue(elementId, btnElement) {
    let input = document.getElementById(elementId);
    if (!input || !input.value) return;

    navigator.clipboard.writeText(input.value).then(() => {
      let originalText = btnElement.textContent;
      btnElement.textContent = "COPIED!";
      setTimeout(() => {
        btnElement.textContent = originalText;
      }, 1200);
    });
  }
</script>
