<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Admin Portal - rorraxy</title>

    <!-- Favicon Logo -->
    <link rel="icon" type="image/png" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png">

    <!-- Ecosystem Core Script -->
    <script src="/ecosystem-core.js"></script>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-retail: #000000;
            --card-retail: #050508;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --pink-solid: linear-gradient(135deg, #ff2a85 0%, #ff479b 100%);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #8e8e99;
            --font-main: 'Poppins', sans-serif;
            --required-red: #ff4d4d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; overflow-x: hidden; background: var(--bg-retail) !important; color: var(--text-white); font-family: var(--font-main); min-height: 100vh; font-size: 15px; -webkit-font-smoothing: antialiased; }
        body { display: flex; align-items: center; justify-content: center; padding: 20px; text-transform: uppercase; }

        .auth-wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            background: var(--card-retail);
            border: 1px solid rgba(255, 42, 133, 0.15);
            border-radius: 24px;
            width: 100%;
            padding: 38px 26px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }

        .auth-logo {
            width: 120px;
            height: auto;
            max-height: 120px;
            object-fit: contain;
            margin: 0 auto;
            filter: drop-shadow(0 6px 20px rgba(255, 42, 133, 0.25)) !important;
        }

        .auth-title {
            font-size: 1.15rem;
            font-weight: 800;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.2px;
            margin-top: -4px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-gray);
            letter-spacing: 0.8px;
        }

        .form-control {
            width: 100%;
            background: #000000;
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 14px;
            padding: 14px 16px;
            color: var(--text-white);
            font-weight: 600;
            font-size: 0.88rem;
            outline: none;
            font-family: var(--font-main);
            text-transform: none;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }

        .form-control:focus {
            border-color: var(--gold-solid);
            background: #030305;
        }

        .form-control::placeholder {
            font-size: 0.75rem;
            color: #555566;
            text-transform: none;
        }

        .email-hint {
            font-size: 0.62rem;
            color: var(--text-gray);
            text-transform: none;
            letter-spacing: 0.2px;
            margin-top: 2px;
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .auth-btn {
            width: 100%;
            background: var(--gold-gradient);
            border: none;
            border-radius: 14px;
            padding: 15px;
            color: #030305;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            transition: transform 0.15s ease, filter 0.2s ease;
            margin-top: 4px;
            text-align: center;
        }

        .auth-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
        .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .verify-action-btn {
            width: 100%;
            background: var(--pink-solid);
            border: none;
            border-radius: 14px;
            padding: 15px;
            color: #ffffff;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 0 25px rgba(255, 42, 133, 0.4);
            transition: all 0.25s ease;
        }

        .verify-action-btn:hover {
            filter: brightness(1.12);
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(255, 42, 133, 0.6);
        }

        .status-msg {
            font-size: 0.72rem;
            text-transform: none;
            margin-top: -2px;
            display: none;
            text-align: center;
            font-weight: 600;
        }
        .status-msg.error { color: var(--required-red); }
        .status-msg.success { color: #2ecc71; }

        #step2PasswordForm {
            display: none;
            animation: fadeIn 0.35s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .auth-card { padding: 30px 18px; gap: 16px; }
            .auth-title { font-size: 1.05rem; }
            .auth-logo { width: 105px; }
        }
    </style>
</head>
<body>

    <script>
        if (
            localStorage.getItem('rorraxy_admin_verified') === 'true' &&
            localStorage.getItem('rorraxy_admin_authenticated_session') === 'active' &&
            localStorage.getItem('rorraxy_master_key_passed') === 'true'
        ) {
            window.location.replace('/dashboard.html');
        }
    </script>

    <div class="auth-wrapper">
        <div class="auth-card">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="rorraxy logo" class="auth-logo">

            <h2 class="auth-title" id="portalHeading">STEP 1: ADMIN VERIFICATION</h2>

            <!-- ধাপ ১: ইমেইল ভেরিফিকেশন ফর্ম -->
            <form id="magicLinkForm" class="auth-form">
                <div class="form-group">
                    <label>ADMIN EMAIL ADDRESS <span style="color:var(--required-red)">*</span></label>
                    <input type="email" class="form-control" id="adminEmail" placeholder="Enter authorized email..." required autocomplete="email">
                    <span class="email-hint"><i class="fa-solid fa-shield-halved" style="color: #ff2a85;"></i> Step 1 of 2: Email Identity Check</span>
                </div>

                <div id="formStatus" class="status-msg"></div>

                <button type="submit" class="auth-btn" id="sendLinkBtn">VERIFY EMAIL & PROCEED</button>
            </form>

            <!-- ধাপ ২: মাস্টার পাসওয়ার্ড ফর্ম -->
            <form id="step2PasswordForm" class="auth-form">
                <div class="form-group">
                    <label>SECURITY MASTER PASSWORD <span style="color:var(--required-red)">*</span></label>
                    <input type="password" class="form-control" id="masterPasswordInput" placeholder="Enter master security password..." required autocomplete="off">
                    <span class="email-hint"><i class="fa-solid fa-key" style="color: #d4af37;"></i> Step 2 of 2: Strict Security Lock</span>
                </div>

                <div id="passStatus" class="status-msg"></div>

                <button type="submit" class="verify-action-btn" id="unlockDashboardBtn">
                    <i class="fa-solid fa-lock-open"></i> UNLOCK & ENTER DASHBOARD
                </button>
            </form>
        </div>
    </div>

    <script>
        // আপনার admin.js যে পাথ বা Worker-এ ডিপ্লয় করা আছে, প্রয়োজনে সেটি দিন (যেমন '/admin' বা '/api/admin')
        const ADMIN_API_BASE = "/admin";
        const STRICT_MASTER_PASS = "rorraxy2026";

        const magicLinkForm = document.getElementById('magicLinkForm');
        const step2PasswordForm = document.getElementById('step2PasswordForm');
        const portalHeading = document.getElementById('portalHeading');

        const adminEmailInput = document.getElementById('adminEmail');
        const sendLinkBtn = document.getElementById('sendLinkBtn');
        const formStatus = document.getElementById('formStatus');

        const masterPasswordInput = document.getElementById('masterPasswordInput');
        const passStatus = document.getElementById('passStatus');
        const unlockDashboardBtn = document.getElementById('unlockDashboardBtn');

        let isStep1Passed = false;
        let verifiedEmail = "";

        function isAuthenticEmail(email) {
            const blockedDomains = ['tempmail', '10minutemail', 'throwaway', 'mailinator', 'yopmail', 'disposable', 'trashmail'];
            const domain = email.split('@')[1];
            if (!domain) return false;
            for (let b of blockedDomains) {
                if (domain.includes(b)) return false;
            }
            return true;
        }

        function showStatus(element, message, isError = false) {
            element.innerText = message;
            element.className = 'status-msg ' + (isError ? 'error' : 'success');
            element.style.display = 'block';
        }

        // ধাপ ১ সাবমিট: admin.js (?action=verify)-এ ইমেইল ভেরিফাই ও D1 আপডেট
        magicLinkForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = adminEmailInput.value.trim().toLowerCase();

            if (!email) return;

            if (!isAuthenticEmail(email)) {
                showStatus(formStatus, 'Temporary or fake emails are strictly blocked.', true);
                return;
            }

            sendLinkBtn.disabled = true;
            sendLinkBtn.innerText = "VERIFYING IDENTITY...";
            formStatus.style.display = 'none';

            try {
                const response = await fetch(`${ADMIN_API_BASE}?action=verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    isStep1Passed = true;
                    verifiedEmail = email;
                    localStorage.setItem('rorraxy_admin_verified', 'true');
                    localStorage.setItem('rorraxy_admin_email', email);

                    magicLinkForm.style.display = 'none';
                    portalHeading.innerText = "STEP 2: SECURITY LOCK";
                    step2PasswordForm.style.display = 'flex';
                    masterPasswordInput.focus();
                } else {
                    showStatus(formStatus, data.error || 'Email verification failed. Access denied.', true);
                    sendLinkBtn.disabled = false;
                    sendLinkBtn.innerText = "VERIFY EMAIL & PROCEED";
                }
            } catch (err) {
                showStatus(formStatus, 'Network error! Could not verify server.', true);
                sendLinkBtn.disabled = false;
                sendLinkBtn.innerText = "VERIFY EMAIL & PROCEED";
            }
        });

        // ধাপ ২ সাবমিট: পাসওয়ার্ড যাচাই এবং admin.js (?action=register)-এ রেকর্ড সিঙ্ক
        step2PasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const savedEmail = verifiedEmail || localStorage.getItem('rorraxy_admin_email') || "";
            if (!isStep1Passed && localStorage.getItem('rorraxy_admin_verified') !== 'true') {
                window.location.reload();
                return;
            }

            const enteredPass = masterPasswordInput.value.trim();

            if (enteredPass !== STRICT_MASTER_PASS) {
                showStatus(passStatus, 'Incorrect Master Password! Access Denied.', true);
                masterPasswordInput.value = '';
                masterPasswordInput.focus();
                return;
            }

            unlockDashboardBtn.disabled = true;
            unlockDashboardBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> UNLOCKING...';
            passStatus.style.display = 'none';

            try {
                const response = await fetch(`${ADMIN_API_BASE}?action=register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: savedEmail,
                        password: enteredPass
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    showStatus(passStatus, data.error || 'Could not sync verification with server.', true);
                    unlockDashboardBtn.disabled = false;
                    unlockDashboardBtn.innerHTML = '<i class="fa-solid fa-lock-open"></i> UNLOCK & ENTER DASHBOARD';
                    return;
                }

                localStorage.setItem('rorraxy_admin_verified', 'true');
                localStorage.setItem('rorraxy_admin_authenticated_session', 'active');
                localStorage.setItem('rorraxy_master_key_passed', 'true');
                localStorage.setItem('rorraxy_session_timestamp', Date.now().toString());

                showStatus(passStatus, 'Access Granted! Entering Dashboard...', false);

                setTimeout(() => {
                    window.location.replace('/dashboard.html');
                }, 700);
            } catch (err) {
                showStatus(passStatus, 'Network error while saving admin session.', true);
                unlockDashboardBtn.disabled = false;
                unlockDashboardBtn.innerHTML = '<i class="fa-solid fa-lock-open"></i> UNLOCK & ENTER DASHBOARD';
            }
        });
    </script>
</body>
</html>
